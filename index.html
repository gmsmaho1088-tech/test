<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界地図画像生成アプリ</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    label { font-weight: 600; }

    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #f3f4f6; }

    #selectedCountry {
      color: var(--muted);
      font-weight: 600;
    }

    .canvas-wrap {
      padding: 12px;
      display: grid;
      place-items: center;
    }

    #map {
      width: min(96vw, 1300px);
      height: min(82vh, 760px);
      background: #dbeafe;
      border: 1px solid var(--border);
      border-radius: 10px;
      touch-action: none;
    }

    .country {
      fill: #e5e7eb;
      stroke: #ffffff;
      stroke-width: 0.5;
      cursor: pointer;
      transition: fill 120ms ease-in-out;
    }

    .country:hover {
      fill: #93c5fd;
    }
  </style>
</head>
<body>
  <header>
    <div class="group">
      <label for="colorPicker">選択色:</label>
      <input id="colorPicker" type="color" value="#ff5722" />
    </div>

    <div class="group">
      <span>選択中の国:</span>
      <span id="selectedCountry">未選択</span>
    </div>

    <button id="downloadBtn" type="button">PNGをダウンロード</button>
    <button id="resetBtn" type="button">色をリセット</button>
    <span id="status" style="color:#6b7280;font-weight:600;">読み込み中...</span>
  </header>

  <div class="canvas-wrap">
    <svg id="map" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" aria-label="世界地図"></svg>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script>
    const svg = d3.select("#map");
    const width = 1200;
    const height = 700;

    const g = svg.append("g");
    const selectedCountryEl = document.getElementById("selectedCountry");
    const colorPicker = document.getElementById("colorPicker");
    const resetBtn = document.getElementById("resetBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusEl = document.getElementById("status");

    const projection = d3.geoNaturalEarth1().fitExtent([[20, 20], [width - 20, height - 20]], { type: "Sphere" });
    const path = d3.geoPath(projection);

    svg.append("rect")
      .attr("x", 0)
      .attr("y", 0)
      .attr("width", width)
      .attr("height", height)
      .attr("fill", "#bfdbfe");

    g.append("path")
      .datum({ type: "Sphere" })
      .attr("d", path)
      .attr("fill", "#e0f2fe")
      .attr("stroke", "#93c5fd")
      .attr("stroke-width", 1);

    const zoom = d3.zoom()
      .scaleExtent([1, 10])
      .on("zoom", (event) => {
        g.attr("transform", event.transform);
      });
    svg.call(zoom);

    async function loadCountries() {
      statusEl.textContent = "地図データを読み込み中...";
      const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
      const countries = topojson.feature(world, world.objects.countries).features;

      g.selectAll("path.country")
        .data(countries)
        .join("path")
        .attr("class", "country")
        .attr("d", path)
        .attr("data-country-id", (d) => d.id)
        .on("click", function(event, d) {
          const selectedColor = colorPicker.value;
          const countryName = d.properties?.name || `国ID: ${d.id}`;

          d3.select(this).attr("fill", selectedColor);
          selectedCountryEl.textContent = countryName;
        });

      statusEl.textContent = `読み込み完了: ${countries.length}か国`;
    }

    loadCountries().catch((err) => {
      console.error("地図データの読み込みに失敗しました", err);
      selectedCountryEl.textContent = "地図データの読み込み失敗";
      statusEl.textContent = "読み込み失敗: ネットワーク環境やCDN制限をご確認ください";
    });

    resetBtn.addEventListener("click", () => {
      g.selectAll("path.country").attr("fill", "#e5e7eb");
      selectedCountryEl.textContent = "未選択";
      svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
    });

    downloadBtn.addEventListener("click", () => {
      const clonedSvg = document.getElementById("map").cloneNode(true);
      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(clonedSvg);
      const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#bfdbfe";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        const png = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = png;
        a.download = `world-map-${Date.now()}.png`;
        a.click();
        URL.revokeObjectURL(url);
      };
      img.src = url;
    });
  </script>
</body>
</html>
